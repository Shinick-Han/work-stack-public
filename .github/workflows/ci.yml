name: Work Stack quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit source export boundary
        run: python scripts/audit_export.py .

      - name: Install browser runtimes
        run: npm --prefix frontend exec -- playwright install chromium firefox webkit

      - name: Run Chromium product and accessibility gates
        run: npm --prefix frontend run test:e2e:run

      - name: Run Firefox and WebKit compatibility gates
        run: npm --prefix frontend run test:e2e:compat

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
