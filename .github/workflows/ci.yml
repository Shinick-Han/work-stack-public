name: Work Stack quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-reusable.yml
    with:
      checkout_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      coverage_base_ref: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
