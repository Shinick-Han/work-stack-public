name: Work Stack immutable release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA reachable from the protected default branch
        required: true
        type: string
      version:
        description: Canonical X.Y.Z version matching workstack/__init__.py
        required: true
        type: string
      previous_version:
        description: Canonical X.Y.Z version of the preceding public Work Stack installer
        required: true
        type: string
      release_base_sha:
        description: Full source commit SHA of the previously published release
        required: true
        type: string
      publish:
        description: Publish the verified bundle to the allowlisted public repository
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      selection: ${{ steps.classify.outputs.selection }}
      tree_sha: ${{ steps.identity.outputs.tree_sha }}
      browser_compat: ${{ steps.classify.outputs.browser_compat }}
      targeted_mutation: ${{ steps.classify.outputs.targeted_mutation }}
      windows_extended: ${{ steps.classify.outputs.windows_extended }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate protected candidate identity
        id: identity
        shell: pwsh
        run: |
          $candidatePath = Join-Path $env:RUNNER_TEMP 'candidate.json'
          python scripts/release_gate.py validate-candidate --sha "${{ inputs.candidate_sha }}" --version "${{ inputs.version }}" --default-ref "origin/${{ github.event.repository.default_branch }}" --output $candidatePath
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity validation failed.' }
          if ("${{ inputs.previous_version }}" -notmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or
              [version]"${{ inputs.previous_version }}" -ge [version]"${{ inputs.version }}") {
            throw 'previous_version must be canonical and older than version.'
          }
          $candidate = Get-Content -Raw -LiteralPath $candidatePath | ConvertFrom-Json
          "tree_sha=$($candidate.tree_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Classify release risk fail closed
        id: classify
        shell: pwsh
        run: |
          $selectionPath = Join-Path $env:RUNNER_TEMP 'release-selection.json'
          python scripts/release_gate.py classify --base "${{ inputs.release_base_sha }}" --head "${{ inputs.candidate_sha }}" --output $selectionPath
          if ($LASTEXITCODE -ne 0) { throw 'Release change classification failed.' }
          $selection = Get-Content -Raw -LiteralPath $selectionPath | ConvertFrom-Json
          $compact = $selection | ConvertTo-Json -Depth 8 -Compress
          "selection=$compact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "browser_compat=$($selection.gates.browser_compat.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "targeted_mutation=$($selection.gates.targeted_mutation.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "windows_extended=$($selection.gates.windows_extended.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  quality:
    needs: candidate
    uses: ./.github/workflows/quality-reusable.yml
    with:
      checkout_sha: ${{ inputs.candidate_sha }}
      coverage_base_ref: ''

  release-build:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.release_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.release_upload.outputs.artifact-digest }}
      installer_sha256: ${{ steps.bundle.outputs.installer_sha256 }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Assert clean absent release outputs
        shell: pwsh
        run: |
          foreach ($path in @('frontend/dist', '.artifacts/release-output', '.artifacts/release-bundle')) {
            if (Test-Path -LiteralPath $path) { throw "Release output already exists: $path" }
          }
          python scripts/release_gate.py validate-candidate --sha "${{ inputs.candidate_sha }}" --version "${{ inputs.version }}" --default-ref "origin/${{ github.event.repository.default_branch }}" --output "$env:RUNNER_TEMP/candidate.json"

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend exactly once
        run: npm --prefix frontend run build

      - name: Freeze frontend distribution
        shell: pwsh
        run: >-
          python scripts/release_gate.py freeze-tree
          --root frontend/dist
          --output .artifacts/release-output/frozen-dist-manifest.json

      - name: Build immutable Windows release bundle
        shell: pwsh
        run: >-
          & scripts/windows/Build-WindowsInstaller.ps1
          -OutputPath ".artifacts/release-output/WorkStack-Setup-${{ inputs.version }}.ps1"

      - name: Verify frozen frontend tree
        shell: pwsh
        run: |
          python scripts/release_gate.py verify-tree --root frontend/dist --manifest .artifacts/release-output/frozen-dist-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen frontend tree verification failed.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne "${{ inputs.candidate_sha }}") { throw "Release HEAD drifted to $head." }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) { throw "Release source checkout became dirty: $($dirty -join '; ')" }

      - name: Assemble and verify internal release receipt
        id: bundle
        shell: pwsh
        run: |
          $output = Resolve-Path '.artifacts/release-output'
          $bundle = New-Item -ItemType Directory -Path '.artifacts/release-bundle'
          foreach ($name in @(
            "WorkStack-Setup-${{ inputs.version }}.ps1",
            "WorkStack-Setup-${{ inputs.version }}.ps1.sha256",
            'workstack-update.json',
            'frozen-dist-manifest.json'
          )) {
            Copy-Item -LiteralPath (Join-Path $output $name) -Destination (Join-Path $bundle $name)
          }
          Copy-Item -LiteralPath 'scripts/windows/Test-WorkStackReleaseBundle.ps1' -Destination $bundle
          python scripts/release_gate.py write-receipt --bundle $bundle --candidate "$env:RUNNER_TEMP/candidate.json"
          python scripts/release_gate.py verify-bundle --bundle $bundle
          & (Join-Path $bundle 'Test-WorkStackReleaseBundle.ps1') -BundlePath $bundle
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bundle "WorkStack-Setup-${{ inputs.version }}.ps1")).Hash.ToLowerInvariant()
          "installer_sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload one immutable release artifact
        id: release_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immutable-release-bundle
          path: .artifacts/release-bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-first-launch:
    needs: release-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download exact immutable artifact by numeric ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify, install, and first-launch exact artifact
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'release-bundle'
          & (Join-Path $bundle 'Test-WorkStackReleaseBundle.ps1') -BundlePath $bundle
          $install = Join-Path $env:RUNNER_TEMP 'work-stack-install'
          $state = Join-Path $env:RUNNER_TEMP 'work-stack-state'
          $data = Join-Path $state 'data'
          $setup = Join-Path $bundle "WorkStack-Setup-${{ inputs.version }}.ps1"
          & $setup -InstallRoot $install -StateRoot $state -DataDir $data -Port 18765 -NoShortcut
          $status = Join-Path $state 'launch-status.json'
          & (Join-Path $install 'scripts/windows/Start-WorkStack.ps1') -InstallRoot $install -StateRoot $state -NoBrowser -SkipBackup -StatusPath $status
          $config = Get-Content -Raw -LiteralPath (Join-Path $state 'config.json') | ConvertFrom-Json
          $health = Invoke-RestMethod -UseBasicParsing -Uri "http://127.0.0.1:$($config.port)/api/v1/health" -TimeoutSec 5
          if ([string]$health.data.status -ne 'ready' -or [string]$health.data.api_version -ne 'v1') { throw 'Installed first launch did not become ready.' }
          if (-not (Test-Path -LiteralPath $status -PathType Leaf)) { throw 'Installed launcher did not report server ownership.' }
          & (Join-Path $install 'scripts/windows/Stop-WorkStack.ps1') -InstallRoot $install

  chromium-smoke:
    needs: release-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download exact immutable artifact by numeric ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-bundle

      - name: Render installed product in native Chromium
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'release-bundle'
          & (Join-Path $bundle 'Test-WorkStackReleaseBundle.ps1') -BundlePath $bundle
          $install = Join-Path $env:RUNNER_TEMP 'work-stack-chromium-install'
          $state = Join-Path $env:RUNNER_TEMP 'work-stack-chromium-state'
          $setup = Join-Path $bundle "WorkStack-Setup-${{ inputs.version }}.ps1"
          & $setup -InstallRoot $install -StateRoot $state -DataDir (Join-Path $state 'data') -Port 18865 -NoShortcut
          & (Join-Path $install 'scripts/windows/Start-WorkStack.ps1') -InstallRoot $install -StateRoot $state -NoBrowser -SkipBackup
          $config = Get-Content -Raw -LiteralPath (Join-Path $state 'config.json') | ConvertFrom-Json
          $url = "http://127.0.0.1:$($config.port)/"
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path -LiteralPath $edge -PathType Leaf)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          if (-not (Test-Path -LiteralPath $edge -PathType Leaf)) { throw 'Native Chromium runtime is unavailable.' }
          $dom = & $edge --headless --disable-gpu --no-first-run --dump-dom $url 2>&1
          if ($LASTEXITCODE -ne 0 -or ($dom -join "`n") -notmatch '<html') { throw 'Native Chromium could not render the installed product.' }
          & (Join-Path $install 'scripts/windows/Stop-WorkStack.ps1') -InstallRoot $install

  browser-compat:
    needs: candidate
    if: needs.candidate.outputs.browser_compat == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install compatibility dependencies
        run: npm --prefix frontend ci
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Build compatibility candidate
        run: npm --prefix frontend run build
      - name: Install Firefox and WebKit
        run: npm --prefix frontend exec -- playwright install firefox webkit
      - name: Run risk-selected compatibility gate
        run: npm --prefix frontend run test:e2e:compat

  targeted-mutation:
    needs: candidate
    if: needs.candidate.outputs.targeted_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run changed-critical mutation sentinels
        run: python scripts/run_mutation_sentinels.py

  windows-extended:
    needs: [candidate, release-build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact upgrade smoke implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Download exact immutable artifact by numeric ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-bundle
      - name: Download and verify preceding public installer
        shell: pwsh
        run: |
          $previousVersion = "${{ inputs.previous_version }}"
          $previousRoot = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'previous-release')
          $previousName = "WorkStack-Setup-$previousVersion.ps1"
          $releaseBase = "https://github.com/Shinick-Han/work-stack-public/releases/download/v$previousVersion"
          Invoke-WebRequest -UseBasicParsing -Uri "$releaseBase/$previousName" -OutFile (Join-Path $previousRoot $previousName)
          Invoke-WebRequest -UseBasicParsing -Uri "$releaseBase/$previousName.sha256" -OutFile (Join-Path $previousRoot "$previousName.sha256")
          & scripts/windows/Test-WorkStackSetup.ps1 -SetupPath (Join-Path $previousRoot $previousName)
      - name: Exercise prior-version upgrade, rollback, and SSOT preservation
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'release-bundle'
          & (Join-Path $bundle 'Test-WorkStackReleaseBundle.ps1') -BundlePath $bundle
          $previousVersion = "${{ inputs.previous_version }}"
          $previousRoot = Join-Path $env:RUNNER_TEMP 'previous-release'
          $previousName = "WorkStack-Setup-$previousVersion.ps1"
          & scripts/windows/Test-WorkStackUpgrade.ps1 `
            -PreviousSetupPath (Join-Path $previousRoot $previousName) `
            -CandidateSetupPath (Join-Path $bundle "WorkStack-Setup-${{ inputs.version }}.ps1") `
            -PreviousVersion $previousVersion

  release-policy:
    if: always()
    needs:
      - candidate
      - quality
      - release-build
      - chromium-smoke
      - windows-first-launch
      - browser-compat
      - targeted-mutation
      - windows-extended
    runs-on: windows-latest
    outputs:
      allow_publish: ${{ steps.policy.outputs.allow_publish }}
    steps:
      - name: Check out release policy implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Evaluate selected results without mutation
        id: policy
        shell: pwsh
        env:
          SELECTION_JSON: ${{ needs.candidate.outputs.selection }}
        run: |
          $selection = Join-Path $env:RUNNER_TEMP 'release-selection.json'
          [IO.File]::WriteAllText($selection, $env:SELECTION_JSON + "`n", [Text.UTF8Encoding]::new($false))
          python scripts/release_gate.py evaluate-policy --selection $selection --output "$env:RUNNER_TEMP/release-policy.json" --github-output $env:GITHUB_OUTPUT --result "release_build=${{ needs.release-build.result }}" --result "quality=${{ needs.quality.result }}" --result "chromium_smoke=${{ needs.chromium-smoke.result }}" --result "windows_first_launch=${{ needs.windows-first-launch.result }}" --result "browser_compat=${{ needs.browser-compat.result }}" --result "targeted_mutation=${{ needs.targeted-mutation.result }}" --result "windows_extended=${{ needs.windows-extended.result }}"
          if ($LASTEXITCODE -ne 0) { throw 'Release policy evaluation failed.' }
          $policy = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/release-policy.json" | ConvertFrom-Json
          if (-not $policy.allow_publish) { throw "Release policy denied publication: $($policy.blocking_results -join ', ')" }
          @(
            '# Work Stack release receipt',
            '',
            "- Candidate: ${{ inputs.candidate_sha }}",
            "- Tree: ${{ needs.candidate.outputs.tree_sha }}",
            "- Version: ${{ inputs.version }}",
            "- Previous version upgrade exercised: ${{ inputs.previous_version }}",
            "- Release base: ${{ inputs.release_base_sha }}",
            "- Selected gates: $($policy.required_jobs -join ', ')",
            "- Artifact ID: ${{ needs.release-build.outputs.artifact_id }}",
            "- Artifact service digest: ${{ needs.release-build.outputs.artifact_digest }}",
            "- Installer SHA-256: ${{ needs.release-build.outputs.installer_sha256 }}",
            '- Public target: Shinick-Han/work-stack-public',
            '- Exceptions: none',
            '- Policy: ALLOW'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  publish:
    needs: [release-build, release-policy]
    if: inputs.publish && needs.release-policy.outputs.allow_publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    environment: work-stack-public-release
    env:
      GH_TOKEN: ${{ secrets.WORKSTACK_PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Download exact immutable artifact by numeric ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-bundle
      - name: Reverify and publish exact allowlisted target
        shell: pwsh
        run: |
          $target = 'Shinick-Han/work-stack-public'
          if ($target -cne 'Shinick-Han/work-stack-public') { throw 'Public release target is not allowlisted.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'release-bundle'
          & (Join-Path $bundle 'Test-WorkStackReleaseBundle.ps1') -BundlePath $bundle
          $tag = "v${{ inputs.version }}"
          $assets = @(Get-ChildItem -LiteralPath $bundle -File | ForEach-Object FullName)
          & gh release create $tag @assets --repo $target --target main --title "Work Stack $tag" --notes "Immutable Work Stack release from ${{ inputs.candidate_sha }}; artifact ${{ needs.release-build.outputs.artifact_id }}; service digest ${{ needs.release-build.outputs.artifact_digest }}."
          if ($LASTEXITCODE -ne 0) { throw 'Public release publication failed.' }
