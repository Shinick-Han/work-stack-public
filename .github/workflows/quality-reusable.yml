name: Reusable Work Stack quality gate

on:
  workflow_call:
    inputs:
      checkout_sha:
        description: Full candidate commit SHA to test
        required: true
        type: string
      coverage_base_ref:
        description: Optional full base commit SHA for changed-code coverage
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Install locked quality dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Check structural quality baseline
        run: python scripts/quality_gate.py check

      - name: Check theme token generation
        run: npm --prefix frontend run theme:check

      - name: Prevent direct theme color growth
        run: python scripts/check_theme_colors.py check

      - name: Run storage contract regression matrix
        run: python scripts/run_storage_regression.py

      - name: Run deterministic SSH regression matrix
        run: python scripts/run_ssh_regression.py

      - name: Run backend tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Write backend coverage report
        run: python -m coverage json

      - name: Run frontend tests
        run: npm --prefix frontend run test:coverage

      - name: Check proportional coverage floors
        run: python scripts/check_coverage.py --base-ref "${{ inputs.coverage_base_ref }}"

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit source export boundary
        run: python scripts/audit_export.py .

      - name: Install browser runtimes
        run: npm --prefix frontend exec -- playwright install chromium firefox webkit

      - name: Run Chromium product and accessibility gates
        run: npm --prefix frontend run test:e2e:run

      - name: Run Firefox and WebKit compatibility gates
        run: npm --prefix frontend run test:e2e:compat

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain structural quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structural-quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/quality
          if-no-files-found: error
          retention-days: 14
