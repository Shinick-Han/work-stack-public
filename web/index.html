<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Stack</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0e1a2b;--line:#253853;--text:#edf4ff;--muted:#8fa3be;--cyan:#3dd9eb;--blue:#55a8ff;--purple:#a78bfa;--amber:#f6c85f;--green:#4dd6a5;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#132b45 0,var(--bg) 35%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .topbar{height:72px;padding:0 22px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #263a54aa;background:#07101de8;backdrop-filter:blur(18px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px;min-width:210px}.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),#5b7cfa 55%,var(--purple));box-shadow:0 0 28px #3dd9eb40;display:grid;place-items:center;color:#06111e;font-weight:1000}.brand h1{font-size:15px;letter-spacing:.12em;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:0}
    .view-tabs{display:flex;padding:4px;background:#0b1727;border:1px solid var(--line);border-radius:12px}.view-tabs button{border:0;color:var(--muted);background:transparent;padding:8px 15px;border-radius:8px;font-weight:700}.view-tabs button.active{background:#1a2c45;color:var(--text);box-shadow:0 4px 12px #0005}.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}.icon-btn{border:1px solid var(--line);background:#101e31;color:var(--text);border-radius:10px;padding:8px 11px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 72px)}.content{padding:18px 20px 26px;min-width:0}.sidebar{border-left:1px solid var(--line);padding:18px;background:#091421aa;display:grid;gap:12px;align-content:start}.metrics{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:14px}.metric{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#111f32,#0c1727)}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;font-size:25px;margin-top:3px}.metric em{font-style:normal;color:var(--green);font-size:11px}
    .surface{border:1px solid var(--line);border-radius:16px;background:#0b1625dd;box-shadow:0 18px 45px #0004;overflow:hidden}.surface-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.surface-head strong{font-size:13px}.surface-head .meta{color:var(--muted);font-size:12px}.surface-head .right{margin-left:auto;display:flex;gap:7px}.surface-head button{border:1px solid var(--line);background:#122139;color:var(--muted);border-radius:8px;padding:6px 9px}.view{display:none}.view.active{display:block}
    .graph-wrap{height:690px;position:relative;overflow:hidden;background-image:radial-gradient(#26415f 1px,transparent 1px);background-size:24px 24px}.graph-wrap svg{width:100%;height:100%;display:block}.edge{fill:none;stroke-width:1.7;opacity:.72}.edge.objective{stroke:#7d6fd1}.edge.worklog{stroke:#47728e;stroke-dasharray:5 5}.edge.note{stroke:#b58b44;stroke-dasharray:3 5}.edge.dependency{stroke:#e07883;stroke-dasharray:8 4}.edge.parent{stroke:#56b6c8}.edge.dim{opacity:.08}.edge.hot{opacity:1;stroke-width:3}.node{cursor:pointer}.node circle,.node rect{stroke:#d8eeff66;stroke-width:1.5;transition:.2s}.node:hover circle,.node:hover rect,.node.hot circle,.node.hot rect{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px #fff6)}.node.dim{opacity:.16}.node text{fill:#dfeaff;font-size:11px;pointer-events:none}.node .node-id{fill:#7890ad;font-size:9px}.node.objective text{font-weight:800}
    .treemap{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:10px;min-height:690px}.tree-group{min-height:215px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#0c1929;display:flex;flex-direction:column;overflow:hidden}.tree-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.tree-title strong{font-size:12px}.tree-title span{color:var(--muted);font-size:11px}.tree-cells{display:flex;flex-wrap:wrap;gap:6px;flex:1}.tree-cell{border:1px solid #ffffff18;border-radius:9px;padding:9px;min-width:105px;min-height:64px;flex-grow:var(--weight);flex-basis:calc(var(--weight)*42px);background:linear-gradient(145deg,#1b3850,#14283c);cursor:pointer;overflow:hidden}.tree-cell[data-priority="P0"]{background:linear-gradient(145deg,#6b2435,#3b1b2b)}.tree-cell[data-priority="P1"]{background:linear-gradient(145deg,#5a4521,#352c1d)}.tree-cell[data-priority="P3"]{background:linear-gradient(145deg,#263249,#192538)}.tree-cell:hover{border-color:#fff7}.tree-cell strong{font-size:11px;display:block}.tree-cell small{color:#b3c4da;font-size:9px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;padding:12px;min-height:690px;overflow-x:auto}.column{background:#091421;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:220px}.column-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#c4d3e7}.count{margin-left:auto;padding:2px 7px;background:#1a2b42;border-radius:99px;color:var(--muted)}.task-card{background:#111f31;border:1px solid #263b57;border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer;box-shadow:0 7px 15px #0003}.task-card:hover{border-color:#55769e}.task-card .priority{display:inline-block;font-size:9px;font-weight:900;padding:2px 5px;border-radius:5px;background:#263850;color:#d6e7ff}.task-card[data-priority="P0"]{border-left:3px solid var(--red)}.task-card[data-priority="P1"]{border-left:3px solid var(--amber)}.task-card[data-priority="P2"]{border-left:3px solid var(--blue)}.task-card[data-priority="P3"]{border-left:3px solid #71839c}.task-card h3{font-size:12px;margin:8px 0 7px}.task-card p{color:var(--muted);font-size:10px;margin:0 0 8px}.task-card footer{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:9px}.task-card select{margin-left:auto;width:78px;background:#0c1929;color:#b9cae0;border:1px solid var(--line);border-radius:6px;font-size:9px}
    .panel{border:1px solid var(--line);background:#0e1a2a;border-radius:14px;padding:14px}.panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#9bb0ca;margin:0 0 11px}.filters{display:grid;gap:8px}.filters input,.filters select,form input,form select,form textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#08131f;color:var(--text);padding:8px}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}.details{white-space:pre-wrap;word-break:break-word;color:#b8c8dd;font-size:12px;min-height:76px}.details strong{color:var(--text);font-size:14px}.details .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{font-size:9px;padding:3px 6px;background:#1d3049;border-radius:99px;color:#c2d4e9}
    details{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}summary{cursor:pointer;color:#b9cbe0;font-size:11px}form{display:grid;gap:7px;margin-top:9px}form button{border:0;border-radius:8px;padding:8px;background:var(--cyan);color:#05202a;font-weight:800}.message{position:fixed;right:330px;bottom:22px;padding:10px 14px;border-radius:10px;background:#12263a;border:1px solid #365572;box-shadow:0 10px 30px #0008;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.message.show{opacity:1;transform:none}.message.err{border-color:#8c3d50;color:#ffc0cb}
    @media(max-width:1050px){.workspace{grid-template-columns:1fr}.sidebar{border-left:0;border-top:1px solid var(--line);grid-template-columns:repeat(2,1fr)}.message{right:22px}.board{grid-template-columns:repeat(4,260px)}}@media(max-width:720px){.topbar{height:auto;padding:12px;flex-wrap:wrap}.brand{min-width:0}.view-tabs{order:3;width:100%}.view-tabs button{flex:1}.content{padding:10px}.metrics{grid-template-columns:repeat(2,1fr)}.treemap{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr}.graph-wrap{height:580px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="logo">W</div><div><h1>WORK STACK</h1><small>aligned execution system</small></div></div><nav class="view-tabs" aria-label="보기 방식"><button data-view="graph" class="active">Graph</button><button data-view="treemap">Treemap</button><button data-view="board">Board</button></nav><div class="top-actions"><span class="status-dot"></span><small id="sync">Local</small><button class="icon-btn" id="refresh">↻ 새로고침</button></div></header>
  <div class="workspace">
    <main class="content"><section class="metrics" id="metrics"></section><section class="surface"><div class="surface-head"><strong id="view-title">업무 관계 지도</strong><span class="meta" id="view-meta"></span><div class="right"><button id="clear-selection">선택 해제</button></div></div><div id="graph" class="view active"><div class="graph-wrap"><svg viewBox="-160 0 1440 760" aria-label="업무 관계 그래프"></svg></div></div><div id="treemap" class="view"><div class="treemap"></div></div><div id="board" class="view"><div class="board"></div></div></section></main>
    <aside class="sidebar">
      <section class="panel"><h2>필터</h2><div class="filters"><input id="search" placeholder="업무 제목 또는 태그 검색"><div class="filter-row"><select id="priority"><option value="all">모든 우선순위</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select><select id="objective"><option value="all">모든 목표</option></select></div></div></section>
      <section class="panel"><h2>관계 범례</h2><div class="legend"><span><i style="background:#a78bfa"></i>목표</span><span><i style="background:#55a8ff"></i>업무</span><span><i style="background:#64748b"></i>실행일</span><span><i style="background:#f6c85f"></i>노트</span><span><i style="background:#e07883"></i>의존성</span><span><i style="background:#56b6c8"></i>상하위</span></div></section>
      <section class="panel"><h2>선택한 항목</h2><div id="details" class="details">그래프 노드나 업무 카드를 선택하세요.</div></section>
      <section class="panel"><h2>빠른 입력</h2>
        <details><summary>목표 추가</summary><form data-path="/api/objectives"><input name="objective" placeholder="Objective" required><input name="quarter" placeholder="YYYY-QN"><button>목표 저장</button></form></details>
        <details><summary>업무 추가</summary><form data-path="/api/v1/tasks"><input name="title" placeholder="Task title" required><textarea name="detail" placeholder="Scope and outcome"></textarea><div class="filter-row"><select name="priority"><option>P0</option><option>P1</option><option selected>P2</option><option>P3</option></select><input name="due" type="date"></div><input name="tags" placeholder="tags, comma-separated"><input name="objective_ids" placeholder="objective ids, comma-separated"><button>업무 저장</button></form></details>
        <details><summary>실행 기록 추가</summary><form data-path="/api/worklog"><input name="task_id" placeholder="Task id" required><input name="done" placeholder="Completed, | separated"><input name="next" placeholder="Next, | separated"><input name="blockers" placeholder="Blockers, | separated"><button>기록 저장</button></form></details>
        <details><summary>노트 추가</summary><form data-path="/api/notes"><textarea name="text" placeholder="Free-form note" required></textarea><input name="links" placeholder="linked ids, comma-separated"><button>노트 저장</button></form></details>
      </section>
    </aside>
  </div><div id="message" class="message"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],colors={objective:"#a78bfa",task:"#55a8ff",subtask:"#3dd9eb",day:"#64748b",note:"#f6c85f"},statusLabel={open:"Open",started:"In progress",done:"Done",dropped:"Dropped"};let state={nodes:[],edges:[],summary:{}},selected=null;
const taskNodes=()=>state.nodes.filter(n=>n.kind==="task"),objectives=()=>state.nodes.filter(n=>n.kind==="objective"),filters=()=>({q:$("#search").value.trim().toLowerCase(),priority:$("#priority").value,objective:$("#objective").value});
function visibleTasks(){const f=filters();return taskNodes().filter(n=>(f.priority==="all"||n.priority===f.priority)&&(f.objective==="all"||(n.objective_ids||[]).includes(f.objective))&&(!f.q||[n.id,n.title,n.detail,...(n.tags||[])].join(" ").toLowerCase().includes(f.q)))}
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}function metric(l,v,n){return `<div class="metric"><span>${l}</span><strong>${v}</strong><em>${n}</em></div>`}
function renderMetrics(){const t=taskNodes(),done=t.filter(x=>x.status==="done").length,started=t.filter(x=>x.status==="started").length,blocked=t.filter(x=>(x.tags||[]).includes("blocked")).length;$("#metrics").innerHTML=metric("Objectives",state.summary.objectives||0,"aligned goals")+metric("Active work",t.filter(x=>["open","started"].includes(x.status)).length,`${started} in progress`)+metric("Completion",t.length?Math.round(done/t.length*100)+"%":"0%",`${done} of ${t.length} tasks`)+metric("Attention",blocked,blocked?"blocked items":"flow is clear")}
function populateObjectives(){const s=$("#objective"),v=s.value;s.innerHTML='<option value="all">모든 목표</option>'+objectives().map(o=>`<option value="${o.id}">${o.id} · ${esc(o.title)}</option>`).join("");s.value=[...s.options].some(o=>o.value===v)?v:"all"}
function graphData(){const tasks=visibleTasks(),ids=new Set(tasks.map(n=>n.id)),subs=new Set();state.edges.forEach(e=>{if(ids.has(e.target)&&e.source.startsWith(e.target+"-S"))subs.add(e.source)});const connected=new Set([...ids,...subs]);state.edges.forEach(e=>{if(ids.has(e.source)||ids.has(e.target)||subs.has(e.source)){connected.add(e.source);connected.add(e.target)}});if(!filters().q&&filters().priority==="all"&&filters().objective==="all")state.nodes.filter(n=>n.kind!=="task"&&n.kind!=="subtask").forEach(n=>connected.add(n.id));return {nodes:state.nodes.filter(n=>connected.has(n.id)),edges:state.edges.filter(e=>connected.has(e.source)&&connected.has(e.target))}}
function positions(nodes){const g={objective:[],task:[],subtask:[],day:[],note:[]};nodes.forEach(n=>(g[n.kind]||g.note).push(n));g.objective.forEach((n,i)=>Object.assign(n,{x:125,y:95+(i+1)*570/(g.objective.length+1)}));g.task.forEach((n,i)=>{const col=i%2,row=Math.floor(i/2),rows=Math.ceil(g.task.length/2);Object.assign(n,{x:390+col*235,y:62+(row+1)*620/(rows+1)})});const tp=Object.fromEntries(g.task.map(n=>[n.id,n]));g.subtask.forEach((n,i)=>{const p=tp[n.id.split("-S")[0]];Object.assign(n,{x:p?p.x+85:690,y:p?p.y+24+(i%3)*16:100+i*30})});g.day.forEach((n,i)=>Object.assign(n,{x:880,y:75+(i+1)*610/(g.day.length+1)}));g.note.forEach((n,i)=>Object.assign(n,{x:1080,y:85+(i+1)*590/(g.note.length+1)}))}
const curve=(a,b)=>{const dx=Math.abs(b.x-a.x),bend=Math.max(35,dx*.42);return `M${a.x},${a.y} C${a.x+(b.x>a.x?bend:-bend)},${a.y} ${b.x-(b.x>a.x?bend:-bend)},${b.y} ${b.x},${b.y}`};
function renderGraph(){const data=graphData(),svg=$("#graph svg");svg.replaceChildren();if(!data.nodes.length){svg.innerHTML='<text x="600" y="370" text-anchor="middle" fill="#8fa3be">조건에 맞는 업무가 없습니다.</text>';return}positions(data.nodes);const ns="http:"+"//www.w3.org/2000/svg",byId=Object.fromEntries(data.nodes.map(n=>[n.id,n]));data.edges.forEach(e=>{const a=byId[e.source],b=byId[e.target];if(!a||!b)return;const p=document.createElementNS(ns,"path");p.setAttribute("d",curve(a,b));p.setAttribute("class",`edge ${e.kind}`);p.dataset.source=e.source;p.dataset.target=e.target;svg.append(p)});data.nodes.forEach(n=>{const g=document.createElementNS(ns,"g");g.setAttribute("class",`node ${n.kind}`);g.setAttribute("transform",`translate(${n.x} ${n.y})`);g.dataset.id=n.id;const shape=document.createElementNS(ns,n.kind==="task"?"rect":"circle");if(n.kind==="task"){shape.setAttribute("x",-10);shape.setAttribute("y",-10);shape.setAttribute("rx",6);shape.setAttribute("width",20);shape.setAttribute("height",20)}else shape.setAttribute("r",n.kind==="objective"?15:n.kind==="note"?10:8);shape.setAttribute("fill",colors[n.kind]||colors.note);g.append(shape);const label=document.createElementNS(ns,"text");label.setAttribute("x",n.kind==="objective"?-22:16);label.setAttribute("y",4);if(n.kind==="objective")label.setAttribute("text-anchor","end");label.textContent=n.title.length>28?n.title.slice(0,27)+"…":n.title;g.append(label);const id=document.createElementNS(ns,"text");id.setAttribute("class","node-id");id.setAttribute("x",n.kind==="objective"?-22:16);id.setAttribute("y",17);if(n.kind==="objective")id.setAttribute("text-anchor","end");id.textContent=n.id;g.append(id);g.addEventListener("click",()=>selectNode(n.id));svg.append(g)});highlight()}
function renderTreemap(){const tasks=visibleTasks(),groups=[...objectives().map(o=>({id:o.id,title:o.title,tasks:tasks.filter(t=>(t.objective_ids||[]).includes(o.id))})),{id:"none",title:"Unaligned / Operations",tasks:tasks.filter(t=>!(t.objective_ids||[]).length)}].filter(g=>g.tasks.length),root=$("#treemap .treemap");root.innerHTML=groups.map(g=>`<section class="tree-group"><div class="tree-title"><strong>${g.id} · ${esc(g.title)}</strong><span>${g.tasks.length} tasks</span></div><div class="tree-cells">${g.tasks.map(t=>`<article class="tree-cell" data-id="${t.id}" data-priority="${t.priority}" style="--weight:${1+(t.subtasks||[]).length}"><strong>${esc(t.title)}</strong><small>${t.id} · ${t.priority} · ${statusLabel[t.status]||t.status}</small></article>`).join("")}</div></section>`).join("")||'<div>조건에 맞는 업무가 없습니다.</div>';root.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",()=>selectNode(el.dataset.id)))}
function renderBoard(){const tasks=visibleTasks(),statuses=["open","started","done","dropped"];$("#board .board").innerHTML=statuses.map(status=>`<section class="column"><div class="column-head">${statusLabel[status]}<span class="count">${tasks.filter(t=>t.status===status).length}</span></div>${tasks.filter(t=>t.status===status).map(t=>`<article class="task-card" data-id="${t.id}" data-priority="${t.priority}"><span class="priority">${t.priority}</span><h3>${esc(t.title)}</h3><p>${esc(t.detail||"No detail")}</p><footer><span>${t.id}</span><span>${t.due||"No due"}</span><select aria-label="${t.id} status">${statuses.map(s=>`<option value="${s}" ${s===t.status?"selected":""}>${statusLabel[s]}</option>`).join("")}</select></footer></article>`).join("")}</section>`).join("");$$(".task-card").forEach(card=>{card.addEventListener("click",e=>{if(e.target.tagName!=="SELECT")selectNode(card.dataset.id)});card.querySelector("select").addEventListener("change",e=>updateStatus(card.dataset.id,e.target.value))})}
function selectNode(id){selected=id;const n=state.nodes.find(x=>x.id===id);if(!n)$("#details").textContent="그래프 노드나 업무 카드를 선택하세요.";else{const related=[...new Set(state.edges.filter(e=>e.source===id||e.target===id).map(e=>e.source===id?e.target:e.source))];$("#details").innerHTML=`<strong>${esc(n.title)}</strong><br>${n.id} · ${esc(n.status||"")}<br>${esc(n.detail||n.meta||"")}<div class="chips">${(n.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join("")}${related.slice(0,8).map(x=>`<span class="chip">↔ ${x}</span>`).join("")}</div>`}highlight()}
function highlight(){const related=new Set([selected]);if(selected)state.edges.forEach(e=>{if(e.source===selected)related.add(e.target);if(e.target===selected)related.add(e.source)});$$("#graph .node").forEach(el=>{el.classList.toggle("hot",el.dataset.id===selected);el.classList.toggle("dim",!!selected&&!related.has(el.dataset.id))});$$("#graph .edge").forEach(el=>{const hot=selected&&(el.dataset.source===selected||el.dataset.target===selected);el.classList.toggle("hot",!!hot);el.classList.toggle("dim",!!selected&&!hot)})}
function render(){renderMetrics();populateObjectives();renderGraph();renderTreemap();renderBoard();$("#view-meta").textContent=`${visibleTasks().length} tasks · ${state.edges.length} relations`;$("#sync").textContent="Synced "+new Date(state.generated_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
async function load(){const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw Error("상태를 불러오지 못했습니다.");state=await r.json();render()}function toast(text,error=false){const el=$("#message");el.textContent=text;el.className="message show"+(error?" err":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className="message",2200)}
let csrfTokenPromise=null;async function csrfToken(force=false){if(force)csrfTokenPromise=null;csrfTokenPromise??=fetch("/api/v1/session",{cache:"no-store",credentials:"same-origin"}).then(async r=>{const value=await r.json();if(!r.ok||!value.data?.csrf_token)throw Error("보안 세션을 만들지 못했습니다.");return value.data.csrf_token});return csrfTokenPromise}function createKey(){return `workstack:${crypto.randomUUID()}`}async function mutate(path,method,body,idempotencyKey=null){const send=async force=>fetch(path,{method,cache:"no-store",credentials:"same-origin",headers:{"Content-Type":"application/json","X-WorkStack-CSRF":await csrfToken(force),...(idempotencyKey?{"Idempotency-Key":idempotencyKey}:{})},body:JSON.stringify(body)});let r;try{r=await send(false)}catch(firstError){if(!idempotencyKey)throw firstError;r=await send(false)}if(r.status===403)r=await send(true);return r}
async function updateStatus(id,status){const task=state.nodes.find(node=>node.id===id),r=await mutate(`/api/v1/tasks/${id}`,"PATCH",{status,revision:task.revision}),result=await r.json();if(!r.ok)return toast(result.error?.message||"변경 실패",true);toast(`${id} → ${status}`);await load()}function values(form){const raw=Object.fromEntries(new FormData(form));for(const n of ["tags","objective_ids","links"])if(n in raw)raw[n]=raw[n].split(",").map(x=>x.trim()).filter(Boolean);for(const n of ["done","next","blockers"])if(n in raw)raw[n]=raw[n].split("|").map(x=>x.trim()).filter(Boolean);for(const [n,v] of Object.entries(raw))if(v==="")delete raw[n];return raw}
$$("[data-view]").forEach(button=>button.addEventListener("click",()=>{$$("[data-view]").forEach(b=>b.classList.toggle("active",b===button));$$(".view").forEach(v=>v.classList.toggle("active",v.id===button.dataset.view));$("#view-title").textContent={graph:"업무 관계 지도",treemap:"목표별 업무 면적도",board:"업무 흐름 보드"}[button.dataset.view]}));[$("#search"),$("#priority"),$("#objective")].forEach(el=>el.addEventListener(el.tagName==="INPUT"?"input":"change",render));$("#refresh").addEventListener("click",()=>load().then(()=>toast("최신 상태로 갱신했습니다.")));$("#clear-selection").addEventListener("click",()=>selectNode(null));$$("form").forEach(form=>form.addEventListener("submit",async e=>{e.preventDefault();const isTask=form.dataset.path==="/api/v1/tasks",key=isTask?(form.dataset.pendingKey||createKey()):null,button=form.querySelector("button");if(isTask)form.dataset.pendingKey=key;button.disabled=true;try{const r=await mutate(form.dataset.path,"POST",values(form),key),result=await r.json();if(!r.ok){if(isTask)delete form.dataset.pendingKey;return toast(result.error?.message||"저장 실패",true)}if(isTask)delete form.dataset.pendingKey;const saved=result.data||result;toast(`저장됨: ${saved.id||saved.task_id||saved.date}`);form.reset();await load()}catch(error){toast(isTask?"응답을 확인할 수 없습니다. 같은 요청으로 다시 시도하세요.":error.message,true)}finally{button.disabled=false}}));load().catch(e=>toast(e.message,true));
</script>
